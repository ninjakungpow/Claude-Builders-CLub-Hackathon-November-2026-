<style>
:root{--bg:#F6F8F7;--sf:#FFFFFF;--sf2:#E9EFED;--tx:#12263A;--mu:#4F6275;--bd:#DAE3E0;--pr:#0B7A75;--pr2:#085F5B;--prs:#D8F0EE;--on:#FFFFFF;--am:#F2A541;--am2:#E2922B;--ink:#12263A;--warn-bg:#FDEBCB;--warn-tx:#6B4300;--good-bg:#D8F0EE;--good-tx:#07524E;--neu-bg:#E5ECEA;--neu-tx:#46596B;--dng:#A12B2B;

:root[data-theme="dark"]{--bg:#0B1926;--sf:#12263A;--sf2:#1A3349;--tx:#E9F1F3;--mu:#9CB1C1;--bd:#24425B;--pr:#14B5AE;--pr2:#5ED3CD;--prs:#12414A;--on:#0B1926;--ink:#1E3D5C;--warn-bg:#3F3012;--warn-tx:#F7C877;--good-bg:#12414A;--good-tx:#7FE0DA;--neu-bg:#1D3247;--neu-tx:#A9BCC9;--dng:#F08A8A;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
h1,h2,h3{font-family:"Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.03em;line-height:1.08;margin:0;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.ico{width:20px;height:20px;flex:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font:800 24px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:-.04em;background:none;border:0;cursor:pointer;color:var(--tx)}
.brand svg{width:32px;height:32px}.brand .hp{color:#14B5AE}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.iconbtn:hover{background:var(--sf2)}
.right{justify-self:end;position:relative}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr2);font-weight:600;border:0;cursor:pointer;font-size:14px}

.main{padding:28px 28px 64px;min-width:0}
.sum{padding:28px 20px 64px 0}

.sumrow b{font-weight:600}.sumrow span{color:var(--mu);font-size:14px}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;border-left:5px solid var(--bd)}

.stat small{display:block;color:var(--mu);font-size:13px;font-weight:500}

.cards.list{grid-template-columns:1fr}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left}
.card:hover{border-color:var(--pr)}
.cards.list .card{flex-direction:row;align-items:center;gap:18px}
.cards.list .card .grow{flex:1}
.card h3{font-size:19px}

.card .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.heart{background:none;border:0;cursor:pointer;color:var(--mu);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin:-6px -8px 0 0}
.heart[aria-pressed="true"]{color:var(--pr)}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:500;background:var(--neu-bg);color:var(--neu-tx)}
.pill.warn{background:var(--warn-bg);color:var(--warn-tx)}.pill.good{background:var(--good-bg);color:var(--good-tx)}
.meta{font-size:13px;color:var(--mu)}
.btn{min-height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--pr)}
.btn.pri{background:var(--pr);border-color:var(--pr);color:var(--on)}
.btn.pri:hover{background:var(--pr2);border-color:var(--pr2)}
.btn.dng{color:var(--dng)}.btn.cta{background:var(--am);border-color:var(--am);color:#12263A}.btn.cta:hover{background:var(--am2);border-color:var(--am2)}.btn.out{border:2px solid var(--pr);color:var(--pr);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email],select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf)}
textarea{min-height:140px;resize:vertical}
.err{color:var(--dng);font-size:14px;margin-top:6px}
.hint{color:var(--mu);font-size:14px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;max-width:680px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}

.seg{display:inline-flex;background:var(--sf2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:9px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--sf);font-weight:600;color:var(--pr2)}
.list-rows{display:flex;flex-direction:column;gap:10px}
.lrow{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lrow .grow{flex:1;min-width:180px}
.lrow input[type=text]{min-height:40px}
.lrow select{width:auto;min-height:40px}
.sec{margin:28px 0 12px;font-size:18px}
.empty{background:var(--sf);border:1px dashed var(--bd);border-radius:16px;padding:28px;text-align:center;color:var(--mu)}
.empty h3{color:var(--tx);margin-bottom:6px;font-size:19px}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--sf);color:var(--tx);padding:0;width:calc(100% - 32px);max-width:540px}
dialog::backdrop{background:rgba(5,12,9,.55)}
.dl{padding:24px}
.dl h2{font-size:24px;margin-bottom:8px}
.dl .row{margin-top:20px}
.note{background:var(--prs);color:var(--pr2);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.check{list-style:none;padding:0;margin:12px 0}
.check li{padding:6px 0 6px 30px;position:relative}
.check li::before{content:"";position:absolute;left:2px;top:10px;width:16px;height:16px;border-radius:5px;border:2px solid var(--pr)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.land{max-width:1120px;margin:0 auto;padding:56px 24px 72px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(2.2rem,5vw,3.9rem);line-height:1.04}
.hero .lead{font-size:19px;color:var(--mu);max-width:50ch;margin-top:22px}
.steps svg{width:100%;height:auto;display:block}
.steps text{font:800 18px "Plus Jakarta Sans",sans-serif;fill:#12263A}
.steps .w{fill:var(--on)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:40px;max-width:760px}
.role{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:22px;text-align:left;cursor:pointer}
.role:hover{border-color:var(--pr)}
.role h2{font-size:22px;margin-bottom:6px}
.role p{color:var(--mu)}
.how{margin-top:64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;max-width:900px;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;padding-top:14px;border-top:3px solid var(--pr)}
.how li::before{content:counter(s);display:block;font:800 15px "Plus Jakarta Sans",sans-serif;color:var(--pr2);margin-bottom:4px}
.how b{display:block;font-weight:600;margin-bottom:2px}
.how span{color:var(--mu);font-size:15px}
.proto{margin-top:48px;color:var(--mu);font-size:14px;max-width:60ch}
.onb{max-width:620px;margin:0 auto;padding:36px 20px 72px}
.prog{display:flex;gap:8px;margin-bottom:24px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.prog i.on{background:var(--pr)}
.onb h1{font-size:32px;margin-bottom:6px}
.pub{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin:18px 0}
.pub .ph{height:120px;background:var(--sf2);display:grid;place-items:center;color:var(--mu)}
.pub .bd{padding:16px 18px}
.codes{letter-spacing:.5em;font-size:22px;text-align:center;font-weight:600}
.scrim{display:none}
.gmap{width:100%;height:min(60vh,520px);border:1px solid var(--bd);border-radius:16px;background:var(--sf2);display:block}
.mapbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mapkey{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.mapkey input{flex:1;min-width:200px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin:10px 0 18px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.lrow.sel{border-color:var(--pr)}
@media (max-width:1100px){.shell{grid-template-columns:240px minmax(0,1fr)}.sum{grid-column:2;padding:0 28px 64px}.main{padding-bottom:28px}}
@media (max-width:760px){
.hero{grid-template-columns:1fr}.steps{max-width:380px}
.shell{grid-template-columns:1fr}.sum{grid-column:1;padding:0 16px 64px}.main{padding:20px 16px 28px}
.side{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 60px);bottom:0;left:0;width:272px;transform:translateX(-102%);transition:transform .2s}
.side.open{transform:none}
.scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgba(5,12,9,.45)}
.cards.list .card{flex-direction:column;align-items:stretch}
}
.menu.fromburger{position:fixed;left:12px;right:auto;top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (min-width:761px){.shell.noside{grid-template-columns:minmax(0,1fr) 288px}.shell.noside .side{display:none}}
@media (min-width:761px) and (max-width:1100px){.shell.noside{grid-template-columns:minmax(0,1fr)}.shell.noside .sum{grid-column:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <button class="brand" id="brand" aria-label="anyhelp home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--ink)"/><circle cx="12.5" cy="16" r="7" fill="#14B5AE"/><circle cx="19.5" cy="16" r="7" fill="#F2A541" opacity=".92"/></svg><span>any<span class="hp">help</span></span></button>

<script>

var KEY="anyhelp-v1",CATS=["Finance","Marketing","Employment"],COMP={tyne:"Tyne Digital",nu:"Northumbria University"};

{id:"i4",biz:"Harbour Bakery",kind:"Bakery",area:"Tynemouth",title:"Invoice setup",cat:"Finance",desc:"Needs a simple invoice template and a way to track unpaid bills.",check:["Create invoice template","Track unpaid bills","Show how to send reminders"],help:"Paid",hours:3,status:"open",company:null,employee:null,fav:false},

{id:"i6",biz:"Ouseburn Print",kind:"Print shop",area:"Ouseburn",title:"Menu design",cat:"Marketing",desc:"A new menu layout for a local restaurant client.",check:["Draft layout","Pick fonts and colours","Send print-ready file"],help:"Discounted",hours:6,status:"inprogress",company:"tyne",employee:"e1",fav:false}],

ui:{view:"grid",hideClosed:false}}}
var S;try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null}
if(!S||!S.issues)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function nav(){return S.role==="business"?[["b-issues","Overview"],["b-map","Map"],["b-new","List new issue"],["b-update","Update issues"],["b-companies","Update company relationships"]]:[["c-requests","Overview"],["c-map","Map"],["c-add","Add new employee"],["c-specialty","Update specialty"],["c-companies","View companies working with"]]}

function guess(t){var l=t.toLowerCase(),c="Marketing",ti;
if(/invoice|tax|vat|account|payroll|bookkeep|money|cash|bill/.test(l))c="Finance";else if(/hire|staff|recruit|job|intern|student|shift|rota|employ/.test(l))c="Employment";
if(/website|web site|booking/.test(l))ti="Website refresh";else if(/invoice/.test(l))ti="Invoice setup";else if(/staff|hire|recruit/.test(l))ti="Hire staff";else if(/instagram|social|photo/.test(l))ti="Social media help";else{var w=t.trim().split(/\s+/).slice(0,5).join(" ");ti=w.charAt(0).toUpperCase()+w.slice(1)}
var parts=t.split(/[.,;\n]| and /).map(function(x){return x.trim()}).filter(function(x){return x.length>3}).slice(0,4).map(function(x){return x.charAt(0).toUpperCase()+x.slice(1)});
if(!parts.length)parts=["Talk through what’s needed"];
return{title:ti,cat:c,check:parts,help:"Free",hours:parts.length*2,desc:t.trim().slice(0,120)}}

/* Maps. Issue pins sit near the area centre only, never on a business's address. */
var GEO={Newcastle:[54.9783,-1.6178],Tynemouth:[55.0179,-1.425],Gateshead:[54.9526,-1.6014],Ouseburn:[54.9755,-1.593]};
var CO={tyne:{ll:[54.969,-1.605],area:"Quayside, Newcastle"},nu:{ll:[54.9777,-1.6075],area:"City centre, Newcastle",cats:["Employment"]}};
var REL=[["tyne","nu","Referral partner"]],PINC={issue:"#E8833A",done:"#0B7A75",company:"#2F5FD0"},GKEY="anyhelp-gmaps-key";
var mapSel=null,gm=null,gmBad=false,gmPts=[];
function gmKey(){try{return localStorage.getItem(GKEY)||""}catch(e){return""}}
function coCats(k){if(CO[k].cats)return CO[k].cats;return CATS.filter(function(c){return S.employees.some(function(e){return e.specialty===c})})}
function matches(i){return Object.keys(CO).filter(function(k){return coCats(k).indexOf(i.cat)>=0})}
function mapIssues(){var l=S.role==="business"?mine():S.issues.filter(function(i){return i.status==="open"||i.company==="tyne"});return visible(l).filter(function(i){return i.status!=="draft"&&i.status!=="notneeded"})}
function issueLL(i,n){var a=i.biz==="me"?S.business.area:i.area,b=GEO[a]||GEO.Newcastle,t=n*2.4;return[b[0]+.003*Math.cos(t),b[1]+.005*Math.sin(t)]}
function coPt(k){var c=mapIssues().filter(function(i){return i.company===k}),p=REL.filter(function(r){return r[0]===k||r[1]===k}).map(function(r){return COMP[r[0]===k?r[1]:r[0]]+" ("+r[2].toLowerCase()+")"});
return{co:k,label:COMP[k],sub:coCats(k).join(", ")+" · "+CO[k].area+(p.length?" · "+p.join(", "):"")+" · "+c.length+(c.length===1?" client":" clients"),ll:CO[k].ll,color:PINC.company}}
function issuePt(i,n){var m=matches(i).map(function(k){return COMP[k]}),s=i.company?COMP[i.company]+": "+BL[i.status][0].toLowerCase():"Could help: "+(m.join(", ")||"no match yet");
return{id:i.id,label:i.title+" · "+whoFor(i),sub:i.cat+" · "+s,ll:issueLL(i,n),color:revealed(i)?PINC.done:PINC.issue}}
function mapData(){var mode=S.ui.map==="companies"?"companies":"issues",iss=mapIssues(),pts=[],lines=[],idx={};
iss.forEach(function(i,n){var linked=!!i.company;if(mode==="issues"||linked){idx[i.id]=issuePt(i,n);pts.push(idx[i.id])}});
var cos=mode==="companies"?Object.keys(CO):Object.keys(CO).filter(function(k){return iss.some(function(i){return i.company===k})});
cos.forEach(function(k){idx[k]=coPt(k);pts.push(idx[k])});
iss.forEach(function(i){if(i.company&&idx[i.id]&&idx[i.company])lines.push({a:idx[i.id].ll,b:idx[i.company].ll,color:PINC.done,o:.9})});
if(mode==="companies")REL.forEach(function(r){lines.push({a:CO[r[0]].ll,b:CO[r[1]].ll,color:PINC.company,o:.9})});
return{mode:mode,pts:pts,lines:lines}}
function embedSrc(p){var q=p?p.ll[0].toFixed(4)+","+p.ll[1].toFixed(4):"Newcastle upon Tyne";return"https://www.google.com/maps?q="+encodeURIComponent(q)+"&z="+(p?14:11)+"&output=embed"}
function mapView(){var d=mapData(),live=gmKey()&&!gmBad,p=d.pts[mapSel]||null;gmPts=d.pts;
var body='<div class="bar"><h2>Map</h2></div><div class="mapbar"><div class="seg"><button data-a="mapmode" data-m="issues" aria-pressed="'+(d.mode==="issues")+'">Client issues</button><button data-a="mapmode" data-m="companies" aria-pressed="'+(d.mode==="companies")+'">Companies</button></div></div>';
body+=live?'<div class="gmap" id="gmap" role="application" aria-label="Google map of '+d.mode+'"></div>':'<iframe class="gmap" id="gframe" title="Google map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="'+esc(embedSrc(p))+'"></iframe>';
body+='<div class="legend"><span><i style="background:'+PINC.issue+'"></i>Needs help</span><span><i style="background:'+PINC.done+'"></i>Being helped</span><span><i style="background:'+PINC.company+'"></i>Company</span><span>Issue pins show the rough area only</span></div>';
body+=d.pts.length?'<div class="list-rows">'+d.pts.map(function(x,n){return'<div class="lrow'+(n===mapSel?" sel":"")+'"><div class="grow"><b>'+esc(x.label)+'</b><div class="meta">'+esc(x.sub)+'</div></div><button class="btn" data-a="mfocus" data-p="'+n+'">Show on map</button><button class="btn" data-a="mopen" data-'+(x.co?'co="'+x.co:'iss="'+x.id)+'">Details</button></div>'}).join("")+"</div>":'<div class="empty"><h3>Nothing to map yet</h3><p>Issues appear here once they are sent to companies.</p></div>';
body+=live?'<div class="mapkey"><button class="btn" data-a="mapnokey">Remove map key</button></div>':'<div class="panel" style="margin-top:18px"><b>Show every pin at once</b><p class="hint">This map shows one place at a time. Add a Google Maps API key to see all pins and connections together. It stays in this browser.</p><div class="mapkey"><input type="text" id="gkey" autocomplete="off" spellcheck="false" aria-label="Google Maps API key" placeholder="Paste API key"><button class="btn pri" data-a="mapsavekey">Use key</button></div></div>';
var ni=d.pts.filter(function(x){return x.id}).length,nc=d.pts.length-ni;
return shell(S.role==="business"?"b-map":"c-map",body,sumRows([["I","Issues on map",String(ni)],["C","Companies on map",String(nc)],["L","Connections",String(d.lines.length)]]))}
