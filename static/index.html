<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEhelp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/nehelp.css">
</head>
<body>
<header class="top">
  <div><button class="iconbtn" id="burger" aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
  <a class="brand" id="brand" href="#home" aria-label="NEhelp home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--ink)"/><circle cx="12.5" cy="16" r="7" fill="#14B5AE"/><circle cx="19.5" cy="16" r="7" fill="#F2A541" opacity=".92"/></svg><span>NE<span class="hp">help</span></span></a>
  <div class="right"><div class="rolesw" role="group" aria-label="Switch between small business and company view"><button data-a="role" data-r="business" aria-pressed="false"><span class="lg">Small business</span><span class="sm">Business</span></button><button data-a="role" data-r="company" aria-pressed="false">Company</button></div><button class="tbtn topmap" id="topmap">Map</button><button class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">NE</button><div class="menu" id="menu" hidden></div></div>
</header>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/state.js"></script>
<script src="js/landing.js"></script>
<script src="js/layout.js"></script>
<script src="js/business.js"></script>
<script src="js/map.js"></script>
<script src="js/company.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
